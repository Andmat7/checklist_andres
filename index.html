<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0b0a1a">
  <title>Pirámide Diaria</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      color-scheme: dark;
      --background: #0b0a1a;
      --text: #f4f2ff;
      --muted: #a59cc9;
    }
    body {
      margin: 0;
      min-height: 100vh;
      background: radial-gradient(ellipse at 50% 0%, #2a1d4a 0%, #15122b 45%, var(--background) 100%) fixed;
      color: var(--text);
      font-family: "Manrope", system-ui, sans-serif;
      -webkit-font-smoothing: antialiased;
    }
    .effect_layer {
      position: fixed;
      inset: 0;
      pointer-events: none;
    }
    .effect_layer canvas {
      display: block;
    }
    #sky {
      z-index: 0;
    }
    app-shell {
      position: relative;
      z-index: 1;
    }
    #sparkles {
      z-index: 2;
    }
  </style>
  <script type="module" src="src/main.js"></script>
</head>
<body>
  <div id="sky" class="effect_layer"></div>
  <app-shell></app-shell>
  <div id="sparkles" class="effect_layer"></div>
</body>
</html>
